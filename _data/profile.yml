      text: "Coupled a high-frequency estuary observatory with a 3D water quality model to identify the controls on metabolism in the Swan–Canning Estuary."
      outcome: "An integrated observation and modelling approach to estuary metabolism."
      link: ""        # optional: thesis or paper URL
    - tag: "Forecasting"
