hero:
  eyebrow: "Research at the water's edge"
  name: "Dr. Amina Saeed"
  role: "Environmental and chemical engineer, water researcher & data scientist"
  intro: "I study how physical and biogeochemical processes control oxygen, carbon and nutrients in rivers, estuaries and coastal waters, and combine high-frequency sensors, 3D models and machine learning to explain and forecast water quality."
  # Add your photo to assets/images/ and put its path here, e.g. "/assets/images/portrait.jpg".
  # Leave blank to show the painted placeholder.
  portrait: ""
  portrait_alt: "Portrait of Dr. Amina Saeed"
  portrait_caption: "In the field and in the studio"

about:
  eyebrow: "About"
  heading: "From sensors to forecasts"
  text: "My PhD at The University of Western Australia coupled a high-frequency estuary observatory with a 3D water quality model to identify the controls on metabolism in the Swan–Canning Estuary. Since then I have collaborated on deep learning for water quality forecasting (Environmental Modelling & Software, 2024) and co-authored AlgAlert, an algal bloom early-warning model (Ecological Informatics, 2025)."
  art_text: "In government (DBCA, Western Australia) and industry (BHP) I have turned models into operational tools: a real-time estuary water quality dashboard, a water accounting tool for mine sites, and machine-learning tools that predict ore grades and help managers decide where to mine. Earlier, I built and tested dissolved oxygen and thermophysical sensors at NYU and UWA."
  # Replace or add to these with your own highlights.
  stats:
    - value: "PhD"
      label: "The University of Western Australia"
    - value: "3"
      label: "sectors: research, government and industry"
    - value: "2"
      label: "published forecasting models (2024, 2025)"

research:
  eyebrow: "Questions worth exploring"
  heading: "Research areas"
  intro: "From rivers to estuaries and coastal waters, my work connects what we measure with what we can model, explain and forecast."
  # icon can be: drop, waves, leaf, pulse, layers
  areas:
    - icon: drop
      title: "Oxygen, carbon and nutrients"
      text: "How physical and biogeochemical processes control oxygen, carbon and nutrient dynamics in rivers, estuaries and coastal waters."
    - icon: pulse
      title: "High-frequency observation"
      text: "In-situ sensors and estuary observatories that capture rapid changes in water quality, and the sensor design behind them."
    - icon: layers
      title: "Models and machine learning"
      text: "3D hydrodynamic–biogeochemical models and machine learning that explain what drives water quality and forecast what comes next."

work:
  eyebrow: "From observation to insight"
  heading: "Selected work"
  intro: "Three projects that link field data, models and decisions."
  projects:
