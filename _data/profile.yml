# ---------------------------------------------------------------
#  PROFILE CONTENT — everything on the home page lives here.
#  Edit the words in quotes and commit. Lines starting with # are notes.
# ---------------------------------------------------------------

hero:
  eyebrow: "Research at the water's edge"
  name: "Dr. Maya Chen"
  role: "Marine hydrologist, water researcher & artist"
  intro: "Exploring how water connects rivers, coasts, and communities — and how research and painting can help us see a changing climate more clearly."
  # Add your photo to assets/images/ and put its path here, e.g. "/assets/images/portrait.jpg".
  # Leave blank to show the painted placeholder.
  portrait: ""
  portrait_alt: "Portrait of Dr. Maya Chen"
  portrait_caption: "In the field and in the studio"

about:
  eyebrow: "About the researcher"
  heading: "Following water, understanding change"
  text: "Maya's research focuses on freshwater resilience, ocean health, and climate adaptation. She brings field observations and practical questions together to explore how connected water systems respond to change."
  art_text: "Alongside the science, she paints. The rivers and coastlines she measures by day become watercolours and ink studies in the studio — another way of noticing what the data can't hold."
  # Replace with your own numbers. Add or remove items freely.
  stats:
    - value: "12"
      label: "years in research"
    - value: "38"
      label: "field studies"
    - value: "24"
      label: "publications"

research:
  eyebrow: "Questions worth exploring"
  heading: "Research areas"
  intro: "From inland catchments to coastal waters, the work looks at the relationships that shape healthy, adaptable water systems."
  # icon can be: drop, waves, leaf
  areas:
    - icon: drop
      title: "Freshwater systems"
      text: "How rivers, streams, and catchments respond to pressure — and what helps freshwater habitats remain resilient."
    - icon: waves
      title: "Coastal ecosystems"
      text: "The changing exchange between land and sea, with attention to water quality and coastal habitat health."
    - icon: leaf
      title: "Climate resilience"
      text: "Ways to turn observations of shifting water conditions into clearer adaptation questions and choices."

work:
  eyebrow: "From observation to insight"
  heading: "Selected work"
  intro: "Three examples of the research themes and practical outputs that guide this work."
  projects:
    - tag: "Freshwater"
      title: "Reading river change"
      text: "Comparing field observations across changing river conditions to understand where freshwater systems face pressure."
      outcome: "A clearer framework for identifying questions to investigate in future field studies."
      link: ""        # optional: a paper, report or blog post URL
    - tag: "Coastal waters"
      title: "Where rivers meet the sea"
      text: "Examining how freshwater movement and coastal conditions interact at the boundary between land and ocean."
      outcome: "A practical way to organise observations of connected coastal water conditions."
      link: ""
    - tag: "Adaptation"
      title: "Planning for variability"
      text: "Bringing water observations into conversations about how ecosystems and communities might respond to climate change."
      outcome: "Accessible research questions to support more informed adaptation discussions."
      link: ""

studio:
  eyebrow: "Art practice"
  heading: "In the studio"
  statement: "I paint water the way I study it: slowly, from the bank, waiting for the pattern to surface."
  text: "Watercolour and ink studies made alongside fieldwork. Each piece starts as a sketch in a field notebook and is finished in the studio."
  # SAMPLE IMAGES — the pictures in assets/images/art/ are placeholders.
  # Replace them with photos of your own work (JPG, under ~500 KB each)
  # and update the titles, medium and year below.
  pieces:
    - image: "/assets/images/art/tidal-study.svg"
      title: "Tidal study I"
      medium: "Watercolour on cotton paper"
      year: "2025"
    - image: "/assets/images/art/estuary-dusk.svg"
      title: "Estuary at dusk"
      medium: "Watercolour and gouache"
      year: "2025"
    - image: "/assets/images/art/after-rain.svg"
      title: "Catchment, after rain"
      medium: "Ink and wash"
      year: "2024"
    - image: "/assets/images/art/salt-marsh.svg"
      title: "Salt marsh notes"
      medium: "Watercolour on paper"
      year: "2024"
    - image: "/assets/images/art/riverbed.svg"
      title: "Riverbed stones"
      medium: "Watercolour and graphite"
      year: "2023"
    - image: "/assets/images/art/open-water.svg"
      title: "Open water, no horizon"
      medium: "Watercolour on paper"
      year: "2023"

journey:
  eyebrow: "A research journey"
  heading: "Curiosity in motion"
  intro: "A simple path from studying water systems to asking how research — and art — can inform a more resilient future."
  # Placeholder image: replace with a photo of your own, e.g. "/assets/images/river.jpg"
  image: "/assets/images/art/river-journey.svg"
  image_alt: "A river running through forest"
  steps:
    - title: "Education in water systems"
      text: "Built a foundation in the movement of water and the connections between aquatic environments."
    - title: "Field-based research"
      text: "Developed an observation-led approach to freshwater and coastal research."
    - title: "Climate adaptation focus"
      text: "Now explores how water research can frame practical questions about environmental change."

contact:
  eyebrow: "Start a conversation"
  heading: "Get in touch"
  text: "Have a question about water research, a commission, or an idea to explore? Send a short message using the form."
