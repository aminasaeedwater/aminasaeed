<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 9.5c2.3-1.6 4.7-1.6 7 0s4.7 1.6 7 0M5 14.5c2.3-1.6 4.7-1.6 7 0s4.7 1.6 7 0"/></svg>
      </span>
      <span class="brand-name">{{ site.title }}<span aria-hidden="true"> · </span><span class="brand-tag">{{ site.tagline }}</span></span>
    </a>
    <nav aria-label="Main">
      <ul>
        {% assign home = '/' | relative_url %}
        <li><a href="{{ home }}#about">About</a></li>
        <li><a href="{{ home }}#research">Research</a></li>
        <li><a href="{{ '/art/' | relative_url }}" {% if page.url == '/art/' %}aria-current="page"{% endif %}>Art</a></li>
        <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Writing</a></li>
        {% if site.course.show %}<li><a href="{{ '/course/' | relative_url }}" {% if page.url == '/course/' %}aria-current="page"{% endif %}>Course</a></li>{% endif %}
        {% if site.contact.show %}<li><a href="{{ home }}#contact">Contact</a></li>{% endif %}
      </ul>
    </nav>
  </div>
</header>
